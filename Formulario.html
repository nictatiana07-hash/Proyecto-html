<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Quicksand", sans-serif;
        }

        .login {
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            width: 300px;
        }

        .logo {
            width: 120px; /* Tamaño para que se vea bien centrado */
            margin-bottom: 24px;
            display: block; /* Visible siempre para probar que cargue bien */
            align-self: center;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #7f7f7f;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 1.5px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .input {
            background-color: #ffe6e6;
            border: none;
            border-radius: 8px;
            height: 40px;
            padding: 8px;
            margin-bottom: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .primary-button {
            background-color: #acd9b2;
            border-radius: 12px;
            border: none;
            color: white;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            height: 50px;
            margin-top: 14px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="login">
        <div class="form-container">
            <img src="./WhatsApp Image 2026-09-07 at 4.45.04 PM.jpeg" alt="Yard Sale logo" class="logo">
            
            <h1 class="title">Create a new password</h1>
            <p class="subtitle">Enter a new password for you account</p>

            <form action="/" class="form">
                <label for="password" class="label">Password</label>
                <input type="password" class="input" id="password" placeholder="**************">

                <label for="new-password" class="label">Re-enter password</label>
                <input type="password" class="input" id="new-password" placeholder="**************">
                
                <input type="submit" value="Confirm" class="primary-button login-button">
            </form>
        </div>
    </div>
</body>
</html>
